# Nginx site for the dialer monitoring dashboard.
#
# Install:  sudo cp deploy/nginx/dialer-dashboard.conf /etc/nginx/sites-available/
#           sudo ln -sf /etc/nginx/sites-available/dialer-dashboard.conf \
#                       /etc/nginx/sites-enabled/dialer-dashboard.conf
#           sudo rm -f /etc/nginx/sites-enabled/default
#           sudo nginx -t && sudo systemctl reload nginx
#
# Nginx is the only process listening on the network. Gunicorn is bound to
# loopback, so the application server cannot be reached from another machine
# no matter what the firewall says.

# A WebSocket handshake needs "Connection: upgrade" passed through, but an
# ordinary request needs "Connection: close" - sending "upgrade" on every
# request breaks keep-alive. This map picks the right one per request. The
# name is prefixed because a map is defined once per http block and a second
# site defining $connection_upgrade would collide with it.
map $http_upgrade $dialer_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream dialer_dashboard {
    # fail_timeout=0 means "do not take this server out of rotation": there is
    # only one, and marking it down would serve a 502 to everyone until the
    # timer expired, even after Gunicorn came back.
    server 127.0.0.1:8001 fail_timeout=0;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # The LAN address the kiosk and the team use, plus loopback for the
    # scrapers posting to the monitoring API. Django checks the Host header
    # again against ALLOWED_HOSTS, so this is the outer of two gates.
    server_name 10.140.28.15 127.0.0.1 localhost _;

    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    access_log /var/log/nginx/dialer-dashboard.access.log;
    error_log  /var/log/nginx/dialer-dashboard.error.log;

    # Served straight off disk. These never reach Django, which is the point:
    # the application server should not spend a worker on a CSS file.
    location /static/ {
        alias /var/www/dialer-dashboard/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # The live-update channel. It needs its own block because a WebSocket is a
    # connection that stays open for hours: the default 60s read timeout would
    # cut the dashboard off every minute, and response buffering would hold
    # messages back instead of delivering them as they happen.
    location /ws/ {
        proxy_pass http://dialer_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $dialer_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://dialer_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
