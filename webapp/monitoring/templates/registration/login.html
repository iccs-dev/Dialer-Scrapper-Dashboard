<!doctype html>
{% load static %}
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in &middot; Dialer Scraper Dashboard</title>
  <link rel="stylesheet" href="{% static 'monitoring/dashboard.css' %}">
  <script>
    /* Applied before the first paint. Reading the stored theme from the
       stylesheet or from dashboard.js would be too late: the page would paint
       white first and then flip, which on a wall-mounted kiosk is a flash
       every time the browser reloads. */
    (function () {
      try {
        var saved = localStorage.getItem("dashboard-theme");
        var dark = saved ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
</head>
<body class="login-body">
  <form class="login-card" method="post">
    {% csrf_token %}
    <h1>Dialer Scraper Dashboard</h1>
    <p class="sub">Internal monitoring &middot; sign in to continue</p>
    {% if form.errors %}<div class="login-error">Incorrect username or password.</div>{% endif %}
    <label for="id_username">Username</label>
    {{ form.username }}
    <label for="id_password">Password</label>
    {{ form.password }}
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
